<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VAA STORE — The Cosmic Bazaar</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* ═══════════════════════════════════════════════
           GLOBAL VARIABLES & RESET
        ═══════════════════════════════════════════════ */
        :root {
            --primary: #6c5ce7;
            --accent: #ff6b1a;
            --bg-dark: #020205;
            --glass: rgba(15, 15, 25, 0.75);
            --border-glass: rgba(108, 92, 231, 0.4);
            --font-display: 'Orbitron', sans-serif;
            --font-body: 'Space Grotesk', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-dark); color: #fff; font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
        #app { width: 100vw; height: 100vh; position: relative; overflow: hidden; }

        /* ═══════════════════════════════════════════════
           CUSTOM CURSOR
        ═══════════════════════════════════════════════ */
        #cursor-dot { position: fixed; width: 8px; height: 8px; background-color: var(--accent); border-radius: 50%; pointer-events: none; z-index: 99999; transform: translate(-50%, -50%); box-shadow: 0 0 15px var(--accent); }
        #cursor-ring { position: fixed; width: 40px; height: 40px; border: 1px solid var(--primary); border-radius: 50%; pointer-events: none; z-index: 99998; transform: translate(-50%, -50%); transition: width 0.3s, height 0.3s, border-color 0.3s; }

        /* ═══════════════════════════════════════════════
           THREE.JS BACKGROUND
        ═══════════════════════════════════════════════ */
        #canvas-container { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
        .vignette { position: absolute; inset: 0; pointer-events: none; z-index: 50; box-shadow: inset 0 0 250px rgba(0, 0, 0, 0.95); }

        /* ═══════════════════════════════════════════════
           SCENE MANAGER
        ═══════════════════════════════════════════════ */
        .scene { position: absolute; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 1s ease; }
        .scene.active { opacity: 1; pointer-events: auto; }

        /* ═══════════════════════════════════════════════
           SCENE 1: THE GATE (WITH LOGO PARTICLES)
        ═══════════════════════════════════════════════ */
        #scene-gate { background-color: #000; perspective: 2000px; }
        .gate-wrapper { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; transform-style: preserve-3d; }
        .gate-half { position: absolute; width: 50vw; height: 100vh; background-size: cover; background-position: center; z-index: 5; }
        
        #gateleft { left: 0; background-image: url('assets/gateleft.jpeg'); box-shadow: inset -100px 0 200px rgba(0,0,0,1); }
        #gateright { right: 0; background-image: url('assets/gateright.jpeg'); box-shadow: inset 100px 0 200px rgba(0,0,0,1); }

        #portal { position: absolute; width: 100vw; height: 100vh; background-image: url('assets/portal.jpeg'); background-size: contain; background-position: center; background-repeat: no-repeat; opacity: 0; z-index: 1; transform: scale(0.3); filter: drop-shadow(0 0 100px var(--accent)); }

        .gate-ui { position: absolute; z-index: 10; text-align: center; display: flex; flex-direction: column; align-items: center; opacity: 0; }
        .gate-title { font-family: var(--font-display); font-size: clamp(3rem, 8vw, 7rem); font-weight: 900; letter-spacing: 15px; color: #fff; text-shadow: 0 0 20px var(--primary), 0 0 50px var(--primary), 0 0 100px var(--accent); margin-bottom: 10px; transform: translateZ(50px); }
        .gate-subtitle { font-size: 1.2rem; letter-spacing: 10px; color: var(--accent); text-transform: uppercase; font-weight: 600; margin-bottom: 60px; text-shadow: 0 0 20px var(--accent); transform: translateZ(30px); }
        
        .btn-enter { padding: 20px 60px; font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; letter-spacing: 5px; color: #fff; background: rgba(108, 92, 231, 0.1); border: 2px solid var(--primary); border-radius: 5px; cursor: pointer; backdrop-filter: blur(10px); transition: all 0.4s ease; box-shadow: 0 0 30px rgba(108, 92, 231, 0.3); transform: translateZ(40px); position: relative; overflow: hidden; }
        .btn-enter:hover { background: var(--primary); box-shadow: 0 0 60px var(--primary); transform: translateZ(40px) scale(1.05); }
        .btn-enter::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); transition: left 0.5s; }
        .btn-enter:hover::before { left: 100%; }

        /* ═══════════════════════════════════════════════
           SCENE 2: RED CARPET
        ═══════════════════════════════════════════════ */
        #scene-carpet { background-image: url('assets/carpet.jpeg'); background-size: cover; background-position: center; perspective: 1000px; background-color: #000; }
        .bg-shop { position: absolute; bottom: 25%; width: 30vw; height: 40vh; background-size: cover; border-radius: 20px; opacity: 0; filter: blur(10px); border: 1px solid rgba(108, 92, 231, 0.2); }
        #shop-left { left: -5%; background-image: url('assets/card1.jpg'); transform: rotateY(20deg); }
        #shop-right { right: -5%; background-image: url('assets/card2.jpg'); transform: rotateY(-20deg); }

        .char-sprite { position: absolute; bottom: 0; height: 50vh; opacity: 0; filter: blur(5px); mix-blend-mode: screen; z-index: 3; }
        #char-doc { left: 10%; bottom: 10%; }
        #char-pol { left: 25%; bottom: 0; height: 45vh; }
        #char-biz { right: 25%; bottom: 10%; height: 48vh; }
        #char-shop1 { right: 10%; bottom: 0; height: 42vh; }

        #lady-container { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%) translateY(100%) scale(2); height: 85vh; z-index: 10; transform-origin: bottom center; }
        #lady-sprite { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 40px rgba(108,92,231,0.6)); }
        #ship-container { position: absolute; top: -120%; left: 50%; transform: translateX(-50%); width: 90vw; max-width: 800px; z-index: 20; }
        #ship-sprite { width: 100%; filter: drop-shadow(0 30px 60px rgba(0,0,0,0.9)); }

        #speech-bubble { position: absolute; top: 20%; left: 50%; transform: translateX(-50%) scale(0); transform-origin: bottom center; background-color: var(--glass); border: 1px solid var(--border-glass); backdrop-filter: blur(20px); border-radius: 20px; padding: 30px 40px; z-index: 15; text-align: center; width: 90%; max-width: 600px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        #speech-bubble h3 { font-family: var(--font-display); color: var(--accent); font-size: 0.9rem; margin-bottom: 10px; letter-spacing: 2px; }
        #speech-bubble p { font-size: 1.4rem; line-height: 1.5; font-weight: 300; }

        #search-ui { position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%) translateY(50px); width: 90%; max-width: 700px; opacity: 0; z-index: 30; display: flex; gap: 15px; background-color: var(--glass); padding: 12px; border-radius: 60px; border: 1px solid var(--border-glass); backdrop-filter: blur(20px); }
        #search-input { flex: 1; padding: 15px 30px; border-radius: 50px; border: none; background-color: rgba(0,0,0,0.5); color: #fff; font-size: 1.1rem; outline: none; font-family: var(--font-body); }
        #search-btn { padding: 0 50px; border-radius: 50px; background-color: var(--accent); border: none; color: #fff; font-weight: bold; cursor: pointer; font-family: var(--font-display); font-size: 1rem; letter-spacing: 2px; transition: 0.3s; }
        #search-btn:hover { background-color: #ff8c4a; box-shadow: 0 0 30px var(--accent); }

        /* ═══════════════════════════════════════════════
           SCENE 3: WARP
        ═══════════════════════════════════════════════ */
        #scene-warp { background-color: #000; z-index: 50; overflow: hidden; }
        #warp-bg { position: absolute; inset: 0; background-image: url('assets/window.jpg'); background-size: cover; background-position: center; transform: scale(1); opacity: 0; }
        #warp-flash { position: absolute; inset: 0; background: radial-gradient(circle, #fff, transparent); opacity: 0; z-index: 60; }

        /* ═══════════════════════════════════════════════
           SCENE 4: PLANET STORE
        ═══════════════════════════════════════════════ */
        #scene-store { background-image: url('assets/space.jpeg'); background-size: cover; background-position: center; display: block; overflow-y: auto; overflow-x: hidden; position: absolute; inset: 0; opacity: 0; pointer-events: none; }
        #scene-store.active { opacity: 1; pointer-events: auto; }
        #scene-store::before { content: ''; position: fixed; inset: 0; background-color: rgba(2, 2, 5, 0.85); backdrop-filter: blur(10px); z-index: 1; }
        
        .store-nav { position: fixed; top: 0; left: 0; width: 100%; padding: 25px 50px; display: flex; justify-content: space-between; align-items: center; background-color: rgba(5, 5, 10, 0.6); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(108, 92, 231, 0.2); z-index: 100; }
        .store-nav h1 { font-family: var(--font-display); font-size: 2rem; letter-spacing: 8px; color: #fff; }
        .store-nav h1 span { color: var(--accent); }

        .scroll-hero { height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; z-index: 2; }
        .planet-float { position: absolute; width: 40vw; max-width: 600px; border-radius: 50%; opacity: 0.5; filter: blur(2px); }
        #planet-ice { top: 10%; left: -10%; }
        #planet-rocky { bottom: -10%; right: -10%; }
        
        .store-header { text-align: center; z-index: 10; position: relative; }
        .store-header h2 { font-family: var(--font-display); font-size: clamp(3rem, 6vw, 6rem); letter-spacing: 10px; text-shadow: 0 0 50px var(--primary); margin-bottom: 15px; }
        .store-header p { color: var(--accent); font-size: 1.2rem; letter-spacing: 5px; }

        .store-content { position: relative; z-index: 10; max-width: 1400px; margin: 0 auto; padding: 100px 40px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 40px; }
        
        .product-card { background-color: var(--glass); border: 1px solid var(--border-glass); border-radius: 20px; overflow: hidden; transition: 0.4s; display: flex; flex-direction: column; backdrop-filter: blur(10px); position: relative; }
        .product-card:hover { transform: translateY(-15px); border-color: var(--accent); box-shadow: 0 30px 60px rgba(255, 107, 26, 0.2); }
        .product-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 5px; background: linear-gradient(90deg, var(--primary), var(--accent)); opacity: 0; transition: 0.4s; }
        .product-card:hover::before { opacity: 1; }
        
        .product-img-wrap { width: 100%; height: 350px; display: flex; align-items: center; justify-content: center; padding: 20px; background: radial-gradient(circle, rgba(108, 92, 231, 0.15) 0%, transparent 70%); }
        .product-img-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.9)); transition: transform 0.5s; }
        .product-card:hover .product-img-wrap img { transform: scale(1.1) translateY(-10px); }
        
        .product-info { padding: 30px; border-top: 1px solid rgba(255, 255, 255, 0.05); }
        .product-name { font-family: var(--font-display); font-size: 1.4rem; margin-bottom: 10px; }
        .product-price { font-size: 1.6rem; color: var(--accent); font-weight: bold; margin-bottom: 20px; }
        .buy-btn { width: 100%; padding: 18px; border-radius: 12px; background: linear-gradient(135deg, var(--primary), #8c7ae6); border: none; color: white; font-weight: bold; font-family: var(--font-display); cursor: pointer; font-size: 1rem; letter-spacing: 2px; transition: 0.3s; }
        .buy-btn:hover { background: linear-gradient(135deg, #8c7ae6, var(--primary)); box-shadow: 0 0 30px var(--primary); }

        #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 999; }

        /* Mobile */
        @media (max-width: 768px) {
            .gate-title { font-size: 3rem; letter-spacing: 5px; }
            #speech-bubble { top: 15%; }
            .store-nav { padding: 15px 20px; }
            .store-nav h1 { font-size: 1.2rem; }
            .planet-float { width: 80vw; }
            .product-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div id="cursor-dot"></div>
    <div id="cursor-ring"></div>
    <div id="canvas-container"></div>
    <div class="vignette"></div>

    <div id="app">
        
        <!-- SCENE 1: GATE & PARTICLES -->
        <div id="scene-gate" class="scene active">
            <div class="gate-wrapper">
                <div id="portal"></div>
                <div id="gateleft" class="gate-half"></div>
                <div id="gateright" class="gate-half"></div>
                
                <div class="gate-ui" id="gate-ui">
                    <div class="gate-title">VAA STORE</div>
                    <div class="gate-subtitle">The Universe Is Yours</div>
                    <button class="btn-enter" onclick="enterStore()">ENTER</button>
                </div>
            </div>
        </div>

        <!-- SCENE 2: CARPET -->
        <div id="scene-carpet" class="scene">
            <div class="bg-shop" id="shop-left"></div>
            <div class="bg-shop" id="shop-right"></div>

            <img src="assets/doctor.png" class="char-sprite" id="char-doc">
            <img src="assets/police.png" class="char-sprite" id="char-pol">
            <img src="assets/buisnessman.png" class="char-sprite" id="char-biz">
            <img src="assets/shopper1.png" class="char-sprite" id="char-shop1">

            <div id="ship-container"><img src="assets/spaceship.png" id="ship-sprite"></div>
            <div id="lady-container"><img src="assets/ladywalk1.png" id="lady-sprite"></div>
            
            <div id="speech-bubble">
                <h3>VAA STORE GUIDE</h3>
                <p id="speech-text">Welcome to VAA Store!</p>
            </div>

            <div id="search-ui">
                <input type="text" id="search-input" placeholder="What product are you looking for?" onkeypress="handleSearch(event)">
                <button id="search-btn" onclick="triggerWarp()">SEARCH</button>
            </div>
        </div>

        <!-- SCENE 3: WARP -->
        <div id="scene-warp" class="scene">
            <div id="warp-bg"></div>
            <div id="warp-flash"></div>
        </div>

        <!-- SCENE 4: STORE -->
        <div id="scene-store" class="scene">
            <nav class="store-nav"><h1>VAA <span>STORE</span></h1></nav>
            <div class="scroll-hero">
                <img src="assets/ice.jpeg" class="planet-float" id="planet-ice">
                <img src="assets/rocky.jpeg" class="planet-float" id="planet-rocky">
                <div class="store-header">
                    <h2 id="store-title">SECTOR ARRIVAL</h2>
                    <p>Scroll to explore</p>
                </div>
            </div>
            <div class="store-content"><div class="product-grid" id="product-grid"></div></div>
        </div>

        <div id="flash"></div>
    </div>

    <script>
        gsap.registerPlugin(ScrollTrigger);
        
        const SUPABASE_URL = 'https://gynphsibkcrivosuamxp.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5bnBoc2lia2NyaXZvc3VhbXhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4OTA0NzQsImV4cCI6MjEwNTQ2NjQ3NH0.GNKrZgJFj4496-kPzfdc2Fzv3bS8YO6CLrWPV4PyucM';
        const BUCKET = 'product-images';
        const { createClient } = supabase;
        const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- CURSOR ---
        const cursorDot = document.getElementById('cursor-dot');
        const cursorRing = document.getElementById('cursor-ring');
        let mouseX = 0, mouseY = 0, ringX = 0, ringY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX; mouseY = e.clientY;
            gsap.to(cursorDot, { x: mouseX, y: mouseY, duration: 0.1 });
        });

        function renderCursor() {
            ringX += (mouseX - ringX) * 0.15; ringY += (mouseY - ringY) * 0.15;
            gsap.set(cursorRing, { x: ringX, y: ringY });
            requestAnimationFrame(renderCursor);
        }
        renderCursor();

        function applyMagneticEffect(btn) {
            btn.addEventListener('mousemove', (e) => {
                const rect = btn.getBoundingClientRect();
                gsap.to(btn, { x: (e.clientX - rect.left - rect.width/2)*0.3, y: (e.clientY - rect.top - rect.height/2)*0.3, duration: 0.3 });
                gsap.to(cursorRing, { scale: 1.5, borderColor: '#ff6b1a', duration: 0.2 });
            });
            btn.addEventListener('mouseleave', () => {
                gsap.to(btn, { x: 0, y: 0, duration: 0.5, ease: "elastic.out(1, 0.3)" });
                gsap.to(cursorRing, { scale: 1, borderColor: '#6c5ce7', duration: 0.2 });
            });
        }
        document.querySelectorAll('.btn-enter, #search-btn').forEach(applyMagneticEffect);

        // --- VOICE ---
        function speak(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1; utterance.pitch = 1.1;
                const voices = window.speechSynthesis.getVoices();
                const femaleVoice = voices.find(v => v.name.includes('Female') || v.name.includes('Google UK English Female') || v.name.includes('Samantha'));
                if (femaleVoice) utterance.voice = femaleVoice;
                window.speechSynthesis.speak(utterance);
            }
        }

        // --- THREE.JS PARTICLES ---
        let scene, camera, renderer, particlesDust, particlesStar;
        let tX = 0, tY = 0;

        function initThreeJS() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 10;

            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const loader = new THREE.TextureLoader();
            loader.crossOrigin = true;
            
            loader.load('assets/dust.jpg', (texDust) => {
                const geoDust = new THREE.BufferGeometry();
                const verts = [];
                for (let i = 0; i < 3000; i++) verts.push((Math.random() - 0.5) * 60, (Math.random() - 0.5) * 60, (Math.random() - 0.5) * 60);
                geoDust.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
                const matDust = new THREE.PointsMaterial({ size: 0.15, map: texDust, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending, depthWrite: false });
                particlesDust = new THREE.Points(geoDust, matDust);
                scene.add(particlesDust);
            });

            loader.load('assets/star.jpg', (texStar) => {
                const geoStar = new THREE.BufferGeometry();
                const verts = [];
                for (let i = 0; i < 500; i++) verts.push((Math.random() - 0.5) * 80, (Math.random() - 0.5) * 80, (Math.random() - 0.5) * 80);
                geoStar.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
                const matStar = new THREE.PointsMaterial({ size: 1.5, map: texStar, transparent: true, opacity: 1, blending: THREE.AdditiveBlending, depthWrite: false });
                particlesStar = new THREE.Points(geoStar, matStar);
                scene.add(particlesStar);
            });

            document.addEventListener('mousemove', (e) => {
                tX = (e.clientX - window.innerWidth / 2) * 0.001;
                tY = (e.clientY - window.innerHeight / 2) * 0.001;
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            if(particlesDust) {
                particlesDust.rotation.y += 0.0005;
                particlesDust.position.x += (tX * 5 - particlesDust.position.x) * 0.02;
                particlesDust.position.y += (-tY * 5 - particlesDust.position.y) * 0.02;
            }
            if(particlesStar) {
                particlesStar.rotation.y -= 0.0002;
                particlesStar.position.x += (tX * 10 - particlesStar.position.x) * 0.05;
                particlesStar.position.y += (-tY * 10 - particlesStar.position.y) * 0.05;
            }
            renderer.render(scene, camera);
        }

        // --- SCENE MANAGER ---
        function goToScene(sceneId) {
            document.querySelectorAll('.scene').forEach(el => el.classList.remove('active'));
            document.getElementById(`scene-${sceneId}`).classList.add('active');
        }

        // --- LOGO FORMATION & GATE ---
        let logoParticles;
        function initLogoParticles() {
            const geometry = new THREE.BufferGeometry();
            const count = 10000;
            const positions = new Float32Array(count * 3);
            const targetPositions = new Float32Array(count * 3);

            for (let i = 0; i < count; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                const r = Math.random() * 15 + 5;
                positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                positions[i * 3 + 2] = r * Math.cos(phi);
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const loader = new THREE.TextureLoader();
            loader.load('assets/dust.jpg', (texture) => {
                const material = new THREE.PointsMaterial({ size: 0.15, map: texture, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false, color: 0x6c5ce7 });
                logoParticles = new THREE.Points(geometry, material);
                scene.add(logoParticles);

                const img = new Image();
                img.crossOrigin = "Anonymous";
                img.src = 'assets/vaastorelogo.png';
                
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = 300; canvas.height = 300;
                    ctx.drawImage(img, 0, 0, 300, 300);
                    const data = ctx.getImageData(0, 0, 300, 300).data;
                    const valid = [];

                    for (let y = 0; y < 300; y += 2) {
                        for (let x = 0; x < 300; x += 2) {
                            if (data[(y * 300 + x) * 4 + 3] > 128) {
                                valid.push({ x: (x - 150) * 0.1, y: -(y - 150) * 0.1 });
                            }
                        }
                    }

                    for (let i = 0; i < count; i++) {
                        if (valid.length > 0) {
                            const p = valid[Math.floor(Math.random() * valid.length)];
                            targetPositions[i * 3] = p.x + (Math.random() - 0.5) * 0.2;
                            targetPositions[i * 3 + 1] = p.y + (Math.random() - 0.5) * 0.2;
                            targetPositions[i * 3 + 2] = (Math.random() - 0.5) * 2;
                        }
                    }

                    gsap.to(logoParticles.geometry.attributes.position.array, {
                        duration: 4, endArray: targetPositions, ease: "power3.inOut",
                        onUpdate: () => { logoParticles.geometry.attributes.position.needsUpdate = true; }
                    });

                    gsap.to("#gate-ui", { opacity: 1, duration: 2, delay: 1.5 });
                    
                    gsap.to(camera.position, { z: -10, duration: 2.5, delay: 5, ease: "power4.in", onComplete: () => {
                        logoParticles.visible = false;
                        camera.position.z = 10;
                        gsap.set("#gate-ui", { pointerEvents: "auto" });
                    }});
                    gsap.to(logoParticles.material, { opacity: 0, duration: 1, delay: 6 });
                };
            });
        }

        window.onload = () => {
            initThreeJS();
            initLogoParticles();
        };

        window.enterStore = function() {
            document.querySelector('.btn-enter').style.pointerEvents = 'none';
            const tl = gsap.timeline();
            
            tl.to(".gate-ui", { opacity: 0, duration: 0.5, y: -30 });
            tl.to("#gateleft", { rotateY: -120, x: -150, duration: 2.5, ease: "power3.inOut" }, "-=0.2");
            tl.to("#gateright", { rotateY: 120, x: 150, duration: 2.5, ease: "power3.inOut" }, "<");
            tl.to("#portal", { opacity: 1, scale: 4, duration: 2, ease: "power2.in" }, "-=2");
            tl.to(".gate-wrapper", { scale: 6, filter: "blur(20px)", duration: 1.5, ease: "power4.in" }, "-=1");
            tl.to("#flash", { opacity: 1, duration: 0.3 }, "-=0.5");
            
            tl.call(() => {
                goToScene('carpet');
                gsap.set(".gate-wrapper", { scale: 1, filter: "none" });
                gsap.set("#gateleft", { rotateY: 0, x: 0 });
                gsap.set("#gateright", { rotateY: 0, x: 0 });
                gsap.set("#portal", { opacity: 0, scale: 0.3 });
                startCarpetSequence();
            });
            tl.to("#flash", { opacity: 0, duration: 1 });
        };

        // --- CARPET ---
        function startCarpetSequence() {
            const tl = gsap.timeline();
            gsap.set("#scene-carpet", { backgroundPosition: "50% -20%", backgroundSize: "180%" });
            tl.to("#scene-carpet", { backgroundPosition: "50% 50%", backgroundSize: "100%", duration: 3, ease: "power3.out" });
            tl.to(".bg-shop", { opacity: 0.4, duration: 2 }, "-=2");
            tl.to(".char-sprite", { opacity: 1, y: -20, duration: 2, stagger: 0.2 }, "-=1.5");
            gsap.to(".char-sprite", { y: "+=20", duration: 4, yoyo: true, repeat: -1, ease: "sine.inOut", delay: 2 });

            gsap.set("#lady-container", { y: "100%", scale: 2, opacity: 0 });
            tl.to("#lady-container", { y: "0%", opacity: 1, duration: 0.1 });
            
            let walkFrame = 1;
            const walkInterval = setInterval(() => {
                walkFrame = walkFrame === 1 ? 2 : (walkFrame === 2 ? 3 : 1);
                document.getElementById('lady-sprite').src = `assets/ladywalk${walkFrame}.png`;
            }, 180); 

            tl.to("#lady-container", { scale: 1, duration: 4, ease: "power2.out" });
            
            tl.call(() => {
                clearInterval(walkInterval);
                document.getElementById('lady-sprite').src = `assets/ladysmile.png`;
                gsap.to("#speech-bubble", { scale: 1, duration: 0.8, ease: "back.out(1.7)" });
                
                const text1 = "Welcome to VAA Store! We would be happy to host you today.";
                scrambleText("speech-text", text1, 2000);
                speak(text1);
                
                setTimeout(() => {
                    const text2 = "What product are you looking for?";
                    scrambleText("speech-text", text2, 1500);
                    speak(text2);
                    gsap.to("#search-ui", { opacity: 1, y: 0, duration: 0.8 });
                }, 5000);
            });
        }

        function scrambleText(elementId, finalText, duration) {
            const el = document.getElementById(elementId);
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ!<>-_\\/[]{}—=+*^?#________";
            let frame = 0;
            const totalFrames = duration / 16;
            const queue = finalText.split('').map((char, i) => ({ to: char, start: Math.floor(Math.random() * (totalFrames * 0.5)), end: Math.floor(Math.random() * (totalFrames * 0.5)) + (totalFrames * 0.5) }));
            function update() {
                let output = ''; let complete = 0;
                for (let i = 0; i < queue.length; i++) {
                    let { to, start, end } = queue[i];
                    if (frame >= end) { complete++; output += to; }
                    else if (frame >= start) { output += chars[Math.floor(Math.random() * chars.length)]; }
                    else { output += ' '; }
                }
                el.innerHTML = output;
                if (complete === queue.length) return;
                frame++; requestAnimationFrame(update);
            }
            update();
        }

        // --- WARP ---
        window.handleSearch = function(e) { if (e.key === 'Enter') triggerWarp(); }
        window.triggerWarp = function() {
            const query = document.getElementById('search-input').value.trim() || "COSMIC COLLECTION";
            document.getElementById('lady-sprite').src = `assets/ladypoint.png`;
            scrambleText("speech-text", "Ok, let's take a ride.", 1000);
            speak("Okay, let's take a ride.");
            gsap.to("#search-ui", { opacity: 0, duration: 0.4 });

            const tl = gsap.timeline({ delay: 2 });
            tl.to("#ship-container", { top: "10%", duration: 1.5, ease: "bounce.out" });
            tl.to("#scene-carpet", { scale: 3, opacity: 0, duration: 1.5, ease: "power2.in" }, "+=0.5");
            tl.call(() => { goToScene('warp'); gsap.set("#warp-bg", { opacity: 0, scale: 1 }); });
            tl.to("#warp-bg", { opacity: 1, duration: 0.5 });
            tl.to("#warp-bg", { scale: 3, duration: 3, ease: "power3.in" });
            tl.to("#warp-flash", { opacity: 1, duration: 1 }, "-=1");
            tl.call(() => { loadStore(query); });
            tl.to("#warp-flash", { opacity: 0, duration: 1 });
        };

        // --- STORE ---
        async function loadStore(query) {
            document.getElementById('store-title').innerText = `SECTOR: ${query.toUpperCase()}`;
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '<div style="color:#fff; font-size:1.5rem; text-align:center; grid-column:1/-1;">Scanning Universe...</div>';
            goToScene('store');
            document.getElementById('scene-store').scrollTop = 0;

            gsap.to("#planet-ice", { y: -200, rotation: 45, scrollTrigger: { trigger: ".scroll-hero", start: "top top", end: "bottom top", scrub: 1 } });
            gsap.to("#planet-rocky", { y: -300, rotation: -45, scrollTrigger: { trigger: ".scroll-hero", start: "top top", end: "bottom top", scrub: 1 } });

            try {
                let dbQuery = db.from('products').select('*, categories(name)');
                if (query !== "COSMIC COLLECTION") { dbQuery = dbQuery.ilike('name', `%${query}%`); }
                const { data, error } = await dbQuery;
                if (error) throw error;

                grid.innerHTML = '';
                if (data.length === 0) {
                    grid.innerHTML = '<h2 style="color:#ff6b1a; text-align:center; grid-column:1/-1;">No items found in this sector.</h2>';
                    return;
                }

                data.forEach((product, index) => {
                    const imgPath = product.images && product.images[0] ? product.images[0] : null;
                    const imgUrl = imgPath ? db.storage.from(BUCKET).getPublicUrl(imgPath).data.publicUrl : 'assets/card1.jpg';
                    
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <div class="product-img-wrap"><img src="${imgUrl}"></div>
                        <div class="product-info">
                            <div class="product-name">${product.name}</div>
                            <div class="product-price">₹${product.price}</div>
                            <button class="buy-btn">ACQUIRE</button>
                        </div>
                    `;
                    grid.appendChild(card);
                    
                    applyMagneticEffect(card.querySelector('.buy-btn'));
                    gsap.from(card, { opacity: 0, y: 100, rotationX: -20, duration: 1, delay: index * 0.1, ease: "power3.out", scrollTrigger: { trigger: card, start: "top bottom-=50px" } });
                });

            } catch (err) {
                grid.innerHTML = '<h2 style="color:red; text-align:center; grid-column:1/-1;">System Error.</h2>';
            }
        }
    </script>
</body>
