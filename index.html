<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>VAA STORE — Beyond the Gate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #d4af37;
    --gold-soft: #f0d98c;
    --green: #7dffb0;
    --purple: #b06cff;
    --ice: #9fe0ff;
    --bg: #050508;
    --text: #eef1f7;
    --muted: #8a93a6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    overflow: hidden; overscroll-behavior: none;
  }
  body { -webkit-font-smoothing: antialiased; }
  canvas { display: block; }
  #webgl {
    position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1;
    background: radial-gradient(ellipse at center, #0a0a18 0%, #030308 70%, #000 100%);
  }
  #loader {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 28px;
    background: radial-gradient(ellipse at center, #0a0a18 0%, #030308 70%, #000 100%);
    transition: opacity 0.9s ease;
  }
  #loader.fade-out { opacity: 0; pointer-events: none; }
  #loader .logo-wrap {
    position: relative; width: min(340px, 62vw); aspect-ratio: 1 / 1;
    display: flex; align-items: center; justify-content: center;
  }
  #loader .logo-wrap img {
    width: 100%; height: 100%; object-fit: contain;
    mix-blend-mode: screen;
    filter: drop-shadow(0 0 24px rgba(212,175,55,0.55)) drop-shadow(0 0 60px rgba(176,108,255,0.25));
    animation: logoPulse 2.6s ease-in-out infinite;
  }
  @keyframes logoPulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.04); }
  }
  #loader .brand {
    font-family: 'Cinzel', serif; font-weight: 700;
    letter-spacing: 0.55em; font-size: clamp(14px, 2vw, 20px);
    color: var(--gold-soft); text-indent: 0.55em;
    text-shadow: 0 0 18px rgba(212,175,55,0.6);
  }
  #loader .bar-track {
    width: min(360px, 70vw); height: 3px;
    background: rgba(212,175,55,0.15); border-radius: 3px;
    overflow: hidden; position: relative;
  }
  #loader .bar-fill {
    position: absolute; inset: 0; width: 0%;
    background: linear-gradient(90deg, var(--purple), var(--gold), var(--green));
    box-shadow: 0 0 16px rgba(212,175,55,0.8);
    transition: width 0.3s ease;
  }
  #loader .status {
    font-family: 'Orbitron', sans-serif; font-size: 10px;
    letter-spacing: 0.35em; color: var(--muted); text-transform: uppercase;
  }
  #scene-gate {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 34px; pointer-events: none; opacity: 0;
    transition: opacity 1.2s ease;
  }
  #scene-gate.active { opacity: 1; pointer-events: auto; }
  #scene-gate .gate-title {
    font-family: 'Cinzel', serif; font-weight: 900;
    font-size: clamp(34px, 7vw, 92px);
    letter-spacing: 0.22em; text-indent: 0.22em; color: #fff;
    text-shadow: 0 0 20px rgba(212,175,55,0.9), 0 0 60px rgba(212,175,55,0.5), 0 0 120px rgba(176,108,255,0.4);
    padding: 22px 46px;
    border: 1px solid rgba(212,175,55,0.55);
    border-radius: 6px;
    background: rgba(5,6,14,0.35);
    backdrop-filter: blur(6px);
    box-shadow: inset 0 0 40px rgba(212,175,55,0.12), 0 0 60px rgba(212,175,55,0.25);
    text-align: center; line-height: 1;
  }
  #scene-gate .gate-sub {
    font-family: 'Orbitron', sans-serif; font-size: clamp(9px, 1.2vw, 12px);
    letter-spacing: 0.6em; color: var(--gold-soft); opacity: 0.8; text-transform: uppercase;
  }
  #enter-btn {
    pointer-events: auto; cursor: pointer; position: relative;
    font-family: 'Orbitron', sans-serif; font-weight: 700;
    font-size: clamp(12px, 1.4vw, 15px);
    letter-spacing: 0.45em; text-indent: 0.45em;
    color: #0a0a12;
    background: linear-gradient(135deg, var(--gold-soft), var(--gold));
    border: none; padding: 20px 54px; border-radius: 4px;
    box-shadow: 0 0 30px rgba(212,175,55,0.65), 0 0 90px rgba(212,175,55,0.35), inset 0 0 20px rgba(255,255,255,0.35);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    overflow: hidden;
  }
  #enter-btn::after {
    content: ''; position: absolute;
    top: 0; left: -60%; width: 40%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.7), transparent);
    transform: skewX(-20deg);
    animation: btnShine 2.6s ease-in-out infinite;
  }
  @keyframes btnShine {
    0% { left: -60%; } 55% { left: 130%; } 100% { left: 130%; }
  }
  #enter-btn:hover {
    transform: translateY(-2px) scale(1.03);
    box-shadow: 0 0 44px rgba(212,175,55,0.9), 0 0 130px rgba(212,175,55,0.55), inset 0 0 24px rgba(255,255,255,0.5);
  }
  #scene-carpet {
    position: fixed; inset: 0; z-index: 15;
    pointer-events: none; opacity: 0; transition: opacity 1s ease;
  }
  #scene-carpet.active { opacity: 1; }
  #speech-bubble {
    position: fixed; bottom: 22%; left: 50%;
    transform: translate(-50%, 20px) scale(0.92);
    max-width: min(560px, 84vw);
    padding: 22px 30px;
    background: linear-gradient(160deg, rgba(14,16,28,0.94), rgba(8,9,18,0.94));
    border: 1px solid rgba(212,175,55,0.55);
    border-radius: 14px;
    font-family: 'Rajdhani', sans-serif; font-weight: 500;
    font-size: clamp(15px, 1.7vw, 19px);
    line-height: 1.5; color: #f4f6fb;
    box-shadow: 0 0 30px rgba(212,175,55,0.28), 0 0 80px rgba(176,108,255,0.18), inset 0 0 24px rgba(212,175,55,0.06);
    opacity: 0; pointer-events: none;
    transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.2,0.9,0.3,1.2);
    z-index: 40;
  }
  #speech-bubble.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
  #speech-bubble::after {
    content: ''; position: absolute;
    bottom: -11px; left: 50%;
    transform: translateX(-50%) rotate(45deg);
    width: 20px; height: 20px;
    background: rgba(14,16,28,0.94);
    border-right: 1px solid rgba(212,175,55,0.55);
    border-bottom: 1px solid rgba(212,175,55,0.55);
  }
  #search-ui {
    position: fixed; bottom: 8%; left: 50%;
    transform: translate(-50%, 30px);
    width: min(620px, 88vw);
    display: flex; align-items: center; gap: 12px;
    padding: 10px 10px 10px 22px;
    background: rgba(10, 12, 22, 0.82);
    border: 1px solid rgba(212,175,55,0.45);
    border-radius: 60px;
    backdrop-filter: blur(14px);
    box-shadow: 0 0 30px rgba(212,175,55,0.22), 0 0 80px rgba(176,108,255,0.15), inset 0 0 24px rgba(212,175,55,0.05);
    opacity: 0; pointer-events: none;
    transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.2,0.9,0.3,1.1);
    z-index: 35;
  }
  #search-ui.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  #search-ui .search-icon { width: 20px; height: 20px; flex-shrink: 0; opacity: 0.75; color: var(--gold-soft); }
  #search-input {
    flex: 1; background: transparent; border: none; outline: none;
    color: #fff; font-family: 'Rajdhani', sans-serif; font-weight: 500;
    font-size: 17px; letter-spacing: 0.04em; padding: 12px 0;
  }
  #search-input::placeholder { color: rgba(200, 206, 220, 0.5); }
  #search-go {
    flex-shrink: 0; cursor: pointer;
    background: linear-gradient(135deg, var(--gold-soft), var(--gold));
    border: none; color: #0a0a12;
    font-family: 'Orbitron', sans-serif; font-weight: 700;
    font-size: 11px; letter-spacing: 0.3em; text-indent: 0.3em;
    padding: 14px 28px; border-radius: 40px;
    box-shadow: 0 0 20px rgba(212,175,55,0.55);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  #search-go:hover { transform: scale(1.04); box-shadow: 0 0 32px rgba(212,175,55,0.85); }
  #scene-warp-overlay {
    position: fixed; inset: 0; z-index: 18;
    pointer-events: none; opacity: 0;
    transition: opacity 0.8s ease;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(3,4,10,0.85) 100%);
  }
  #scene-warp-overlay.active { opacity: 1; }
  #scene-warp-overlay::after {
    content: ''; position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, rgba(159, 224, 255, 0.03) 0px, rgba(159, 224, 255, 0.03) 1px, transparent 1px, transparent 3px);
    mix-blend-mode: screen; opacity: 0.6;
  }
  #scene-store {
    position: fixed; inset: 0; z-index: 25;
    display: flex; flex-direction: column;
    opacity: 0; pointer-events: none;
    transition: opacity 1s ease;
    overflow-y: auto; overflow-x: hidden;
    padding: 60px 5vw 80px;
    scrollbar-width: thin;
    scrollbar-color: rgba(212,175,55,0.5) transparent;
  }
  #scene-store.active { opacity: 1; pointer-events: auto; }
  #scene-store::-webkit-scrollbar { width: 8px; }
  #scene-store::-webkit-scrollbar-thumb { background: rgba(212,175,55,0.5); border-radius: 8px; }
  #scene-store .store-head { text-align: center; margin-bottom: 48px; flex-shrink: 0; }
  #scene-store .store-head h2 {
    font-family: 'Cinzel', serif; font-weight: 700;
    font-size: clamp(28px, 4.4vw, 54px);
    letter-spacing: 0.18em; text-indent: 0.18em; color: #fff;
    text-shadow: 0 0 24px rgba(159,224,255,0.7), 0 0 70px rgba(212,175,55,0.35);
    margin-bottom: 12px;
  }
  #scene-store .store-head p {
    font-family: 'Orbitron', sans-serif; font-size: 11px;
    letter-spacing: 0.5em; text-indent: 0.5em;
    color: var(--ice); opacity: 0.8; text-transform: uppercase;
  }
  #product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 26px;
    max-width: 1400px; width: 100%; margin: 0 auto; flex-shrink: 0;
  }
  .product-card {
    position: relative;
    background: linear-gradient(160deg, rgba(14,18,32,0.78), rgba(6,8,16,0.86));
    border: 1px solid rgba(159,224,255,0.22);
    border-radius: 14px; overflow: hidden;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 24px rgba(159,224,255,0.08), inset 0 0 24px rgba(159,224,255,0.03);
    transition: transform 0.35s cubic-bezier(0.2,0.9,0.3,1.1), border-color 0.35s ease, box-shadow 0.35s ease;
    opacity: 0; transform: translateY(28px);
    animation: cardRise 0.7s cubic-bezier(0.2,0.9,0.3,1.1) forwards;
  }
  @keyframes cardRise { to { opacity: 1; transform: translateY(0); } }
  .product-card:hover {
    transform: translateY(-6px);
    border-color: rgba(212,175,55,0.65);
    box-shadow: 0 0 40px rgba(212,175,55,0.35), 0 0 90px rgba(159,224,255,0.15), inset 0 0 30px rgba(212,175,55,0.05);
  }
  .product-card .card-img-wrap {
    position: relative; width: 100%; aspect-ratio: 4 / 5; overflow: hidden;
    background: radial-gradient(ellipse at center, #10141f, #05060c);
  }
  .product-card .card-img-wrap img {
    width: 100%; height: 100%; object-fit: cover;
    transition: transform 0.7s cubic-bezier(0.2,0.9,0.3,1.1);
  }
  .product-card:hover .card-img-wrap img { transform: scale(1.08); }
  .product-card .card-body { padding: 18px 20px 22px; }
  .product-card .card-name {
    font-family: 'Cinzel', serif; font-weight: 600;
    font-size: 17px; letter-spacing: 0.06em;
    color: #fff; margin-bottom: 8px; line-height: 1.25;
  }
  .product-card .card-desc {
    font-family: 'Rajdhani', sans-serif; font-size: 13px;
    font-weight: 400; line-height: 1.45; color: var(--muted);
    margin-bottom: 14px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .product-card .card-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .product-card .card-price {
    font-family: 'Orbitron', sans-serif; font-weight: 700;
    font-size: 16px; letter-spacing: 0.05em;
    color: var(--gold-soft); text-shadow: 0 0 12px rgba(212,175,55,0.6);
  }
  .product-card .card-sizes { display: flex; gap: 4px; flex-wrap: wrap; }
  .product-card .card-sizes span {
    font-family: 'Orbitron', sans-serif; font-size: 9px;
    letter-spacing: 0.08em; color: var(--ice);
    border: 1px solid rgba(159,224,255,0.35);
    border-radius: 4px; padding: 2px 6px; opacity: 0.85;
  }
  #store-loading {
    width: 100%; text-align: center; padding: 60px 0;
    font-family: 'Orbitron', sans-serif; font-size: 12px;
    letter-spacing: 0.4em; color: var(--ice);
    text-transform: uppercase; opacity: 0.8;
  }
  #store-loading.hidden { display: none; }
  #flash {
    position: fixed; inset: 0; z-index: 90;
    background: #fff; opacity: 0; pointer-events: none;
    transition: opacity 0.15s ease;
  }
  #flash.on { opacity: 1; }
  #fade {
    position: fixed; inset: 0; z-index: 80;
    background: #000; opacity: 1; pointer-events: none;
    transition: opacity 1s ease;
  }
  #fade.clear { opacity: 0; }
  .hidden { display: none !important; }
</style>
</head>

<script>/* ============================================================
   VAA STORE — PART 2
   Config, Three.js core, composer/bloom, Scene 0 (particle logo),
   Scene 1 (gate + portal + flash)
   ============================================================ */

const SUPABASE_URL = 'https://gynphsibkcrivosuamxp.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5bnBoc2lia2NyaXZvc3VhbXhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4OTA0NzQsImV4cCI6MjEwNTQ2NjQ3NH0.GNKrZgJFj4496-kPzfdc2Fzv3bS8YO6CLrWPV4PyucM';

const ASSETS = {
  logo:      'assets/vaastorelogo.png',
  gateLeft:  'assets/gateleft.jpeg',
  gateRight: 'assets/gateright.jpeg',
  portal:    'assets/portal.jpeg',
  carpet:    'assets/carpet.jpeg',
  nebula:    'assets/nebula.jpg',
  space:     'assets/space.jpg',
  dust:      'assets/dust.jpg',
  star:      'assets/star.jpg',
  noise:     'assets/noise.jpg',
  glow1:     'assets/glow1.jpg',
  glow2:     'assets/glow2.jpg',
  ice:       'assets/ice.jpeg',
  rocky:     'assets/rocky.jpeg',
  cloudy:    'assets/cloudy.jpeg',
  window:    'assets/window.jpg',
  ship:      'assets/spaceship.png',
  lady1:     'assets/ladywalk1.png',
  lady2:     'assets/ladywalk2.png',
  lady3:     'assets/ladywalk3.png',
  ladySmile: 'assets/ladysmile.png',
  ladyPoint: 'assets/ladypoint.png',
  girlTurn:  'assets/girlturn.png',
  doctor:    'assets/doctor.png',
  police:    'assets/police(2).png',
  business:  'assets/buisnessman.png',
  shopper1:  'assets/shopper1.png',
  shopper2:  'assets/shopper2.png',
  orb1:      'assets/orb1.jpeg',
  orb2:      'assets/orb2.jpeg',
  orb3:      'assets/orb3.jpeg',
  orb4:      'assets/orb4.jpeg',
  whoosh:    'assets/wohh.mp4'
};

const STATE = {
  scene: 'loader',
  loaded: false,
  logoTargetsReady: false,
  logoMorphed: false,
  products: [],
  searchQuery: ''
};

let renderer, composer, bloomPass, camera, clock;
let sceneLogo, sceneGate, sceneCarpet, sceneShip, sceneWarp, sceneStore;
let activeScene;

const canvas = document.getElementById('webgl');

function initRenderer() {
  renderer = new THREE.WebGLRenderer({
    canvas: canvas,
    antialias: true,
    alpha: false,
    powerPreference: 'high-performance'
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x030308, 1);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
  camera.position.set(0, 0, 6);

  clock = new THREE.Clock();

  composer = new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(sceneLogo, camera));

  bloomPass = new THREE.UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    1.1,
    0.7,
    0.55
  );
  composer.addPass(bloomPass);
}

function makeSoftDotTexture() {
  const size = 64;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.35, 'rgba(255,255,255,0.7)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  return tex;
}

function makeRadialGlowTexture() {
  const size = 256;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.25, 'rgba(255,255,255,0.7)');
  g.addColorStop(0.55, 'rgba(255,255,255,0.25)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  return tex;
}

function makeStarfield(count, spread) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  const c = new THREE.Color();
  for (let i = 0; i < count; i++) {
    pos[i * 3]     = (Math.random() - 0.5) * spread * 2;
    pos[i * 3 + 1] = (Math.random() - 0.5) * spread * 2;
    pos[i * 3 + 2] = (Math.random() - 0.5) * spread * 2;
    const t = Math.random();
    if (t < 0.7) c.setHex(0xffffff);
    else if (t < 0.88) c.setHex(0xd4af37);
    else c.setHex(0xb06cff);
    col[i * 3] = c.r;
    col[i * 3 + 1] = c.g;
    col[i * 3 + 2] = c.b;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const mat = new THREE.PointsMaterial({
    size: 0.22,
    map: makeSoftDotTexture(),
    vertexColors: true,
    transparent: true,
    opacity: 0.9,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    sizeAttenuation: true
  });
  return new THREE.Points(geo, mat);
}

/* ---------- SCENE 0 — PARTICLE LOGO ---------- */
function createSceneLogo() {
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x030308, 0.06);
  scene.add(new THREE.AmbientLight(0x223355, 0.6));

  const count = 10000;
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const targets = new Float32Array(count * 3);

  const cGold = new THREE.Color(0xd4af37);
  const cPurple = new THREE.Color(0xb06cff);
  const cGreen = new THREE.Color(0x7dffb0);
  const cWhite = new THREE.Color(0xffffff);

  for (let i = 0; i < count; i++) {
    const r = 8 + Math.random() * 22;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    positions[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    positions[i * 3 + 2] = r * Math.cos(phi);

    targets[i * 3]     = 0;
    targets[i * 3 + 1] = 0;
    targets[i * 3 + 2] = 0;

    const t = Math.random();
    let c;
    if (t < 0.45) c = cGold.clone().lerp(cWhite, Math.random() * 0.5);
    else if (t < 0.7) c = cPurple.clone().lerp(cWhite, Math.random() * 0.4);
    else if (t < 0.9) c = cGreen.clone().lerp(cWhite, Math.random() * 0.4);
    else c = cWhite.clone();
    colors[i * 3]     = c.r;
    colors[i * 3 + 1] = c.g;
    colors[i * 3 + 2] = c.b;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.userData = { targets: targets };

  const mat = new THREE.PointsMaterial({
    size: 0.09,
    map: makeSoftDotTexture(),
    vertexColors: true,
    transparent: true,
    opacity: 0.92,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    sizeAttenuation: true
  });

  const points = new THREE.Points(geo, mat);
  points.name = 'logoParticles';
  scene.add(points);

  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = function() { buildLogoTargets(img, geo, count); };
  img.onerror = function() { buildSphereTargets(geo, count); };
  img.src = ASSETS.logo;

  return scene;
}

function buildLogoTargets(img, geo, count) {
  const w = 220;
  const h = 220;
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0, w, h);
  const data = ctx.getImageData(0, 0, w, h).data;

  const bright = [];
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const idx = (y * w + x) * 4;
      const a = data[idx + 3];
      const r = data[idx];
      const g = data[idx + 1];
      const b = data[idx + 2];
      const lum = (r * 0.299 + g * 0.587 + b * 0.114) * (a / 255);
      if (lum > 40 && a > 30) bright.push({ x: x, y: y });
    }
  }

  const targets = geo.userData.targets;
  const scale = 8 / Math.max(w, h);
  const offsetX = -w * scale * 0.5;
  const offsetY = -h * scale * 0.5;

  if (bright.length === 0) { buildSphereTargets(geo, count); return; }

  for (let i = 0; i < count; i++) {
    const b = bright[i % bright.length];
    const jx = (Math.random() - 0.5) * 1.2;
    const jy = (Math.random() - 0.5) * 1.2;
    const jz = (Math.random() - 0.5) * 1.4;
    targets[i * 3]     = offsetX + b.x * scale + jx;
    targets[i * 3 + 1] = -(offsetY + b.y * scale) + jy;
    targets[i * 3 + 2] = jz;
  }
  STATE.logoTargetsReady = true;
}

function buildSphereTargets(geo, count) {
  const targets = geo.userData.targets;
  const R = 3.2;
  for (let i = 0; i < count; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    targets[i * 3]     = R * Math.sin(phi) * Math.cos(theta);
    targets[i * 3 + 1] = R * Math.sin(phi) * Math.sin(theta);
    targets[i * 3 + 2] = R * Math.cos(phi);
  }
  STATE.logoTargetsReady = true;
}

/* ---------- ANIMATE ---------- */
function animateLogo(t, dt) {
  const particles = sceneLogo.getObjectByName('logoParticles');
  if (!particles) return;
  const geo = particles.geometry;
  const pos = geo.attributes.position.array;
  const targets = geo.userData.targets;

  if (!STATE.logoTargetsReady) {
    for (let i = 0; i < pos.length; i += 3) {
      pos[i + 1] += Math.sin(t * 0.8 + i) * 0.002;
    }
    geo.attributes.position.needsUpdate = true;
    return;
  }

  if (!STATE.logoMorphed) {
    const ease = 1 - Math.pow(0.001, dt);
    let done = true;
    for (let i = 0; i < pos.length; i += 3) {
      pos[i]     += (targets[i]     - pos[i])     * ease * 0.6;
      pos[i + 1] += (targets[i + 1] - pos[i + 1]) * ease * 0.6;
      pos[i + 2] += (targets[i + 2] - pos[i + 2]) * ease * 0.6;
      const dx = targets[i]     - pos[i];
      const dy = targets[i + 1] - pos[i + 1];
      const dz = targets[i + 2] - pos[i + 2];
      if (dx*dx + dy*dy + dz*dz > 0.04) done = false;
    }
    geo.attributes.position.needsUpdate = true;
    if (done) {
      STATE.logoMorphed = true;
      gsap.to(camera.position, { z: 5.4, duration: 2.0, ease: 'sine.inOut' });
      setTimeout(function() { transitionToGate(); }, 1600);
    }
  } else {
    particles.rotation.y = Math.sin(t * 0.3) * 0.04;
  }
}

function animateGate(t, dt) {
  const portalGroup = sceneGate.getObjectByName('portalGroup');
  const glow = sceneGate.getObjectByName('portalGlow');
  if (portalGroup) {
    portalGroup.rotation.z = t * 0.15;
    portalGroup.children.forEach(function(child, i) {
      if (child.geometry && child.geometry.type === 'TorusGeometry') {
        child.rotation.z = -t * (0.25 + i * 0.1);
      }
    });
  }
  if (glow) {
    const s = 14 + Math.sin(t * 1.8) * 1.2;
    glow.scale.set(s, s, 1);
    glow.material.opacity = 0.35 + Math.sin(t * 1.8) * 0.12;
  }
}

function resetCamera() {
  camera.position.set(0, 0, 6);
  camera.rotation.set(0, 0, 0);
  camera.fov = 60;
  camera.updateProjectionMatrix();
}

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.elapsedTime;

  if (activeScene === sceneLogo) animateLogo(t, dt);
  else if (activeScene === sceneGate) animateGate(t, dt);
  else if (activeScene === sceneCarpet && typeof animateCarpet === 'function') animateCarpet(t, dt);
  else if (activeScene === sceneShip && typeof animateShip === 'function') animateShip(t, dt);
  else if (activeScene === sceneWarp && typeof animateWarp === 'function') animateWarp(t, dt);
  else if (activeScene === sceneStore && typeof animateStore === 'function') animateStore(t, dt);

  if (activeScene) {
    if (composer.passes[0]) composer.passes[0].scene = activeScene;
    composer.render();
  }
}

/* ---------- TRANSITIONS ---------- */
function transitionToGate() {
  if (STATE.scene === 'gate') return;
  STATE.scene = 'gate';

  const loaderEl = document.getElementById('loader');
  loaderEl.classList.add('fade-out');
  setTimeout(function() { loaderEl.classList.add('hidden'); }, 1000);

  activeScene = sceneGate;
  resetCamera();
  camera.position.set(0, 0.4, 11);

  const fadeEl = document.getElementById('fade');
  fadeEl.classList.remove('clear');

  document.getElementById('scene-gate').classList.add('active');

  gsap.to(camera.position, {
    z: 7.2,
    y: 0.2,
    duration: 3.4,
    ease: 'power2.inOut',
    onStart: function() {
      gsap.to(fadeEl, { opacity: 0, duration: 1.6, ease: 'power2.inOut' });
    }
  });

  document.getElementById('enter-btn').onclick = function() { enterThroughPortal(); };
}

function enterThroughPortal() {
  if (STATE.scene === 'portal') return;
  STATE.scene = 'portal';

  document.getElementById('scene-gate').classList.remove('active');
  playWhoosh();

  const vortex = sceneGate.getObjectByName('portalVortex');
  const glow = sceneGate.getObjectByName('portalGlow');
  const leftDoor = sceneGate.getObjectByName('gateLeft');
  const rightDoor = sceneGate.getObjectByName('gateRight');

  if (leftDoor) gsap.to(leftDoor.position, { x: -6.5, duration: 1.6, ease: 'power3.inOut' });
  if (rightDoor) gsap.to(rightDoor.position, { x: 6.5, duration: 1.6, ease: 'power3.inOut' });

  if (vortex) gsap.to(vortex.material, { opacity: 0.95, duration: 1.2, ease: 'power2.out' });
  if (glow) {
    gsap.to(glow.material, { opacity: 1.0, duration: 1.2, ease: 'power2.out' });
    gsap.to(glow.scale, { x: 22, y: 22, duration: 1.4, ease: 'power2.out' });
  }

  gsap.to(camera.position, { z: -1.2, y: 0, duration: 2.4, ease: 'power3.in', delay: 0.4 });
  gsap.to(camera.rotation, { z: Math.PI * 0.6, duration: 2.4, ease: 'power3.in', delay: 0.4 });

  if (bloomPass) gsap.to(bloomPass, { strength: 3.2, duration: 1.4, ease: 'power2.in', delay: 0.4 });

  const flashEl = document.getElementById('flash');
  gsap.to(flashEl, {
    opacity: 1,
    duration: 0.55,
    ease: 'power2.in',
    delay: 2.3,
    onComplete: function() {
      transitionToCarpet();
      gsap.to(flashEl, { opacity: 0, duration: 1.4, ease: 'power2.out', delay: 0.15 });
      if (bloomPass) gsap.to(bloomPass, { strength: 1.1, duration: 1.4 });
    }
  });
}

let whooshEl = null;
function playWhoosh() {
  try {
    if (!whooshEl) {
      whooshEl = new Audio(ASSETS.whoosh);
      whooshEl.preload = 'auto';
      whooshEl.volume = 0.7;
    }
    whooshEl.currentTime = 0;
    whooshEl.play().catch(function() {});
  } catch (e) {}
}

function onResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  renderer.setSize(w, h);
  composer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);

function boot() {
  initRenderer();
  sceneLogo = createSceneLogo();
  sceneGate = createSceneGate();
  sceneCarpet = createSceneCarpet();
  sceneShip = createSceneShip();
  sceneWarp = createSceneWarp();
  sceneStore = createSceneStore();
  activeScene = sceneLogo;
  animate();
  simulateLoader();
}

function simulateLoader() {
  const bar = document.getElementById('load-bar');
  const status = document.getElementById('load-status');
  const msgs = ['Initializing…', 'Calibrating gate…', 'Summoning particles…', 'Ready.'];
  let p = 0;
  const iv = setInterval(function() {
    p += Math.random() * 9 + 3;
    if (p >= 100) p = 100;
    bar.style.width = p + '%';
    const idx = Math.min(msgs.length - 1, Math.floor(p / 34));
    status.textContent = msgs[idx];
    if (p >= 100) {
      clearInterval(iv);
      STATE.loaded = true;
      setTimeout(function() { transitionToGate(); }, 400);
    }
  }, 130);
}/* ============================================================

   ============================================================ */

let ladySprite = null;
let ladyFrame = 0;
let ladyWalkInterval = null;
let carpetSceneRef = null;

const LADY_WALK_FRAMES = [ASSETS.lady1, ASSETS.lady2, ASSETS.lady3];

/* ---------- SCENE 2 — CARPET ---------- */
function createSceneCarpet() {

function buildHoloShops(scene) {
  const shops = [
    { text: 'ATTIRE',  color: '#d4af37', x: -9,  z: -30 },
    { text: 'TECH',    color: '#9fe0ff', x:  9,  z: -34 },
    { text: 'BEAUTY',  color: '#b06cff', x: -11, z: -42 },
    { text: 'HOME',    color: '#7dffb0', x:  11, z: -46 }
  ];

  shops.forEach(function(shop, i) {
    const c = document.createElement('canvas');
    c.width = 512;
    c.height = 512;
    const ctx = c.getContext('2d');

    ctx.strokeStyle = shop.color;
    ctx.lineWidth = 6;
    ctx.shadowColor = shop.color;
    ctx.shadowBlur = 30;
    ctx.strokeRect(30, 30, 452, 452);

    ctx.strokeStyle = shop.color + '55';
    ctx.lineWidth = 1;
    for (let g = 0; g < 512; g += 32) {
      ctx.beginPath(); ctx.moveTo(g, 30); ctx.lineTo(g, 482); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(30, g); ctx.lineTo(482, g); ctx.stroke();
    }

    ctx.font = 'bold 64px Orbitron, sans-serif';
    ctx.fillStyle = shop.color;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowBlur = 40;
    ctx.fillText(shop.text, 256, 256);

    const tex = new THREE.CanvasTexture(c);
    tex.needsUpdate = true;

    const mat = new THREE.MeshBasicMaterial({
      map: tex,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      side: THREE.DoubleSide
    });

    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(7, 7), mat);
    mesh.position.set(shop.x, 1.5, shop.z);
    mesh.name = 'holoShop' + i;
    scene.add(mesh);

    gsap.to(mat, { opacity: 0.55, duration: 2.0, delay: 0.6 + i * 0.2, ease: 'power2.out' });
  });
}

function animateCarpet(t, dt) {
  if (!carpetSceneRef) return;

  const carpet = carpetSceneRef.getObjectByName('carpet');
  if (carpet && carpet.material.map) {
    carpet.material.map.offset.y = (t * 0.02) % 1;
  }

  [-1, 1].forEach(function(side) {
    const rail = carpetSceneRef.getObjectByName('rail' + side);
    if (rail) rail.material.opacity = 0.7 + Math.sin(t * 2 + side) * 0.25;
  });

  for (let i = 0; i < 4; i++) {
    const h = carpetSceneRef.getObjectByName('holoShop' + i);
    if (h) {
      h.position.y = 1.5 + Math.sin(t * 0.8 + i) * 0.15;
      h.material.opacity = 0.45 + Math.sin(t * 1.2 + i * 1.5) * 0.15;
    }
  }

  for (let i = 0; i < 5; i++) {
    const ch = carpetSceneRef.getObjectByName('char' + i);
    if (ch) ch.position.y = ch.userData.baseY + Math.sin(t * 0.6 + i) * 0.08;
  }
}

function startLadyWalk() {
  if (!ladySprite) return;

  ladyWalkInterval = setInterval(function() {
    ladyFrame = (ladyFrame + 1) % 3;
    new THREE.TextureLoader().load(LADY_WALK_FRAMES[ladyFrame], function(t) {
      t.encoding = THREE.sRGBEncoding;
      ladySprite.material.map = t;
      ladySprite.material.needsUpdate = true;
    });
  }, 220);

  gsap.to(ladySprite.position, {
    z: -14,
    duration: 4.5,
    ease: 'power2.inOut',
    onComplete: function() {
      clearInterval(ladyWalkInterval);
      ladyWalkInterval = null;
      setLadyPose(ASSETS.ladySmile);
      setTimeout(function() { showLadySpeechOne(); }, 400);
    }
  });
}

function setLadyPose(texturePath) {
  if (!ladySprite) return;
  new THREE.TextureLoader().load(texturePath, function(t) {
    t.encoding = THREE.sRGBEncoding;
    ladySprite.material.map = t;
    ladySprite.material.needsUpdate = true;
  });
}

function showLadySpeechOne() {
  const bubble = document.getElementById('speech-bubble');
  const line = 'Welcome to VAA Store! We would be happy to host you today.';
  bubble.textContent = line;
  bubble.classList.add('show');
  speak(line);
  setTimeout(function() { showLadySpeechTwo(); }, 5000);
}

function showLadySpeechTwo() {
  const bubble = document.getElementById('speech-bubble');
  const line = 'What product are you looking for?';
  bubble.textContent = line;
  bubble.classList.add('show');
  speak(line);

  setTimeout(function() {
    bubble.classList.remove('show');
    document.getElementById('search-ui').classList.add('show');
    document.getElementById('search-input').focus();
  }, 2600);
}

function speak(text) {
  try {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.95;
    u.pitch = 1.15;
    u.volume = 0.9;
    const voices = window.speechSynthesis.getVoices();
    const female = voices.find(function(v) {
      return /female|samantha|zira|victoria|karen|moira|tessa/i.test(v.name);
    });
    if (female) u.voice = female;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

/* ---------- SCENE 3 — SHIP + WARP ---------- */
let shipSceneRef = null;
let warpSceneRef = null;
let warpParticles = null;
let warpSpeed = 0;

function createSceneShip() {
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x030308, 0.03);

  scene.add(new THREE.AmbientLight(0x223355, 0.8));
  const key = new THREE.DirectionalLight(0xd4af37, 1.1);
  key.position.set(4, 4, 5);
  scene.add(key);

  const nebulaTex = new THREE.TextureLoader().load(ASSETS.nebula);
  nebulaTex.encoding = THREE.sRGBEncoding;
  const bg = new THREE.Mesh(
    new THREE.PlaneGeometry(120, 120),
    new THREE.MeshBasicMaterial({ map: nebulaTex, transparent: true, opacity: 0.55, depthWrite: false })
  );
  bg.position.set(0, 0, -50);
  bg.name = 'nebulaBg';
  scene.add(bg);

  scene.add(makeStarfield(1200, 100));

  const shipMat = new THREE.SpriteMaterial({
    transparent: true,
    opacity: 0,
    blending: THREE.NormalBlending
  });
  const ship = new THREE.Sprite(shipMat);
  ship.position.set(0, 0, -18);
  ship.scale.set(7, 7, 1);
  ship.name = 'ship';
  scene.add(ship);

  new THREE.TextureLoader().load(ASSETS.ship, function(t) {
    t.encoding = THREE.sRGBEncoding;
    shipMat.map = t;
    shipMat.needsUpdate = true;
    gsap.to(shipMat, { opacity: 1, duration: 1.0 });
  });

  shipSceneRef = scene;
  return scene;
}

function animateShip(t, dt) {
  const ship = shipSceneRef.getObjectByName('ship');
  if (ship) {
    ship.position.y = Math.sin(t * 0.9) * 0.25;
    ship.rotation.z = Math.sin(t * 0.5) * 0.04;
  }
  const bg = shipSceneRef.getObjectByName('nebulaBg');
  if (bg) bg.rotation.z = t * 0.01;
}

function transitionToShipAndWarp(query) {
  STATE.scene = 'ship';
  STATE.searchQuery = query;

  document.getElementById('search-ui').classList.remove('show');
  document.getElementById('speech-bubble').classList.remove('show');

  setLadyPose(ASSETS.girlTurn);
  const bubble = document.getElementById('speech-bubble');
  bubble.textContent = "Okay, let's take a ride.";
  bubble.classList.add('show');
  speak("Okay, let's take a ride.");

  const fadeEl = document.getElementById('fade');
  gsap.to(fadeEl, {
    opacity: 1,
    duration: 1.0,
    ease: 'power2.in',
    delay: 0.6,
    onComplete: function() {
      activeScene = sceneShip;
      resetCamera();
      camera.position.set(0, 0, 8);
      document.getElementById('scene-carpet').classList.remove('active');
      gsap.to(fadeEl, { opacity: 0, duration: 0.9, ease: 'power2.out' });
      setTimeout(function() { animateShipIn(); }, 500);
    }
  });
}

function animateShipIn() {
  const ship = shipSceneRef.getObjectByName('ship');
  if (!ship) return;

  ship.position.set(2, -2, -22);

  gsap.to(ship.position, {
    x: 0.5,
    y: 0.2,
    z: -6,
    duration: 2.6,
    ease: 'power2.inOut',
    onComplete: function() {
      gsap.to(camera.position, {
        z: -3.8,
        y: 0.1,
        duration: 1.6,
        ease: 'power3.in',
        onComplete: function() { switchToWarp(); }
      });
      gsap.to(ship.scale, { x: 14, y: 14, duration: 1.6, ease: 'power3.in' });
    }
  });
}

function createSceneWarp() {
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x020208, 0.02);
  scene.add(new THREE.AmbientLight(0x8899ff, 0.6));

  const winTex = new THREE.TextureLoader().load(ASSETS.window);
  winTex.encoding = THREE.sRGBEncoding;
  const win = new THREE.Mesh(
    new THREE.PlaneGeometry(40, 24),
    new THREE.MeshBasicMaterial({ map: winTex, transparent: true, opacity: 0.85, depthWrite: false })
  );
  win.position.set(0, 0, -22);
  win.name = 'cockpitWin';
  scene.add(win);

  const count = 2400;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  const cA = new THREE.Color(0x9fe0ff);
  const cB = new THREE.Color(0xd4af37);
  const cC = new THREE.Color(0xffffff);

  for (let i = 0; i < count; i++) {
    pos[i * 3]     = (Math.random() - 0.5) * 30;
    pos[i * 3 + 1] = (Math.random() - 0.5) * 20;
    pos[i * 3 + 2] = -Math.random() * 120;
    const r = Math.random();
    const c = r < 0.5 ? cA : (r < 0.8 ? cC : cB);
    col[i * 3] = c.r;
    col[i * 3 + 1] = c.g;
    col[i * 3 + 2] = c.b;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));

  const mat = new THREE.PointsMaterial({
    size: 0.18,
    map: makeSoftDotTexture(),
    vertexColors: true,
    transparent: true,
    opacity: 0.95,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    sizeAttenuation: true
  });

  warpParticles = new THREE.Points(geo, mat);
  warpParticles.name = 'warpParticles';
  scene.add(warpParticles);

  warpSceneRef = scene;
  return scene;
}

function animateWarp(t, dt) {
  if (!warpParticles) return;
  const pos = warpParticles.geometry.attributes.position.array;
  warpSpeed += (14 - warpSpeed) * dt * 0.6;

  for (let i = 2; i < pos.length; i += 3) {
    pos[i] += warpSpeed * dt * 6;
    if (pos[i] > 4) {
      pos[i] = -120;
      pos[i - 2] = (Math.random() - 0.5) * 30;
      pos[i - 1] = (Math.random() - 0.5) * 20;
    }
  }
  warpParticles.geometry.attributes.position.needsUpdate = true;

  const targetFov = 78;
  camera.fov += (targetFov - camera.fov) * dt * 1.5;
  camera.updateProjectionMatrix();
  warpParticles.rotation.z = Math.sin(t * 0.3) * 0.05;
}

function switchToWarp() {
  STATE.scene = 'warp';
  activeScene = sceneWarp;
  resetCamera();
  camera.position.set(0, 0, 3);
  warpSpeed = 0;

  document.getElementById('scene-warp-overlay').classList.add('active');
  if (bloomPass) gsap.to(bloomPass, { strength: 2.0, duration: 0.8 });

  setTimeout(function() { landOnIcePlanet(); }, 3500);
}

/* ---------- SCENE 4 — ICE STORE ---------- */
let storeSceneRef = null;

function createSceneStore() {
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0a1428, 0.025);

  scene.add(new THREE.AmbientLight(0x8899cc, 1.0));
  const key = new THREE.DirectionalLight(0xffffff, 1.2);
  key.position.set(5, 8, 6);
  scene.add(key);
  const rim = new THREE.PointLight(0x9fe0ff, 2.0, 60);
  rim.position.set(-8, 4, -10);
  scene.add(rim);

  const iceTex = new THREE.TextureLoader().load(ASSETS.ice);
  iceTex.encoding = THREE.sRGBEncoding;
  iceTex.wrapS = iceTex.wrapT = THREE.RepeatWrapping;
  iceTex.repeat.set(3, 3);

  const iceGeo = new THREE.PlaneGeometry(80, 80, 40, 40);
  const icePos = iceGeo.attributes.position;
  for (let i = 0; i < icePos.count; i++) {
    const x = icePos.getX(i);
    const y = icePos.getY(i);
    const z = Math.sin(x * 0.5) * Math.cos(y * 0.6) * 0.8;
    icePos.setZ(i, z);
  }
  iceGeo.computeVertexNormals();

  const iceMat = new THREE.MeshStandardMaterial({
    map: iceTex,
    color: 0xaad4ff,
    roughness: 0.6,
    metalness: 0.3,
    flatShading: true
  });

  const ice = new THREE.Mesh(iceGeo, iceMat);
  ice.rotation.x = -Math.PI / 2;
  ice.position.y = -3.2;
  ice.name = 'iceFloor';
  scene.add(ice);

  for (let i = 0; i < 14; i++) {
    const h = 4 + Math.random() * 8;
    const coneGeo = new THREE.ConeGeometry(1.2 + Math.random() * 2, h, 5);
    const coneMat = new THREE.MeshStandardMaterial({
      color: 0x88bbee,
      roughness: 0.5,
      metalness: 0.2,
      flatShading: true,
      transparent: true,
      opacity: 0.85
    });
    const cone = new THREE.Mesh(coneGeo, coneMat);
    const angle = (i / 14) * Math.PI * 2;
    const r = 22 + Math.random() * 12;
    cone.position.set(Math.cos(angle) * r, -3.2 + h / 2, Math.sin(angle) * r);
    cone.rotation.y = Math.random() * Math.PI;
    cone.name = 'mountain' + i;
    scene.add(cone);
  }

  scene.add(makeStarfield(1000, 110));

  const orbPaths = [ASSETS.orb1, ASSETS.orb2, ASSETS.orb3, ASSETS.orb4];
  orbPaths.forEach(function(path, i) {
    const glowMat = new THREE.SpriteMaterial({
      transparent: true,
      opacity: 0.6,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const sprite = new THREE.Sprite(glowMat);
    sprite.scale.set(6, 6, 1);
    const angle = (i / 4) * Math.PI * 2;
    sprite.position.set(Math.cos(angle) * 14, 2 + Math.random() * 3, Math.sin(angle) * 14 - 6);
    sprite.name = 'orb' + i;
    new THREE.TextureLoader().load(path, function(t) {
      t.encoding = THREE.sRGBEncoding;
      glowMat.map = t;
      glowMat.needsUpdate = true;
    });
    scene.add(sprite);
  });

  storeSceneRef = scene;
  return scene;
}

function animateStore(t, dt) {
  if (!storeSceneRef) return;
  [0, 1, 2, 3].forEach(function(i) {
    const orb = storeSceneRef.getObjectByName('orb' + i);
    if (orb) {
      orb.position.y = 2.5 + Math.sin(t * 0.6 + i * 1.4) * 0.6;
      orb.material.opacity = 0.45 + Math.sin(t * 0.9 + i) * 0.15;
    }
  });
  const floor = storeSceneRef.getObjectByName('iceFloor');
  if (floor && floor.material.map) {
    floor.material.map.offset.x = (t * 0.01) % 1;
  }
}

function landOnIcePlanet() {
  STATE.scene = 'store';
  const fadeEl = document.getElementById('fade');

  gsap.to(fadeEl, {
    opacity: 1,
    duration: 0.7,
    ease: 'power2.in',
    onComplete: function() {
      activeScene = sceneStore;
      resetCamera();
      camera.position.set(0, 2.5, 8);
      camera.lookAt(0, 0, -6);

      document.getElementById('scene-warp-overlay').classList.remove('active');
      if (bloomPass) gsap.to(bloomPass, { strength: 0.9, duration: 1.2 });

      gsap.to(fadeEl, { opacity: 0, duration: 1.4, ease: 'power2.out' });

      gsap.to(camera.position, {
        z: 3,
        y: 1.2,
        duration: 3.0,
        ease: 'power2.inOut'
      });

      document.getElementById('scene-store').classList.add('active');
      fetchProducts();
    }
  });
}

/* ---------- SUPABASE ---------- */
let supabaseClient = null;

function initSupabase() {
  if (typeof window.supabase === 'undefined') return null;
  if (!supabaseClient) {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
  return supabaseClient;
}

async function fetchProducts() {
  const loadingEl = document.getElementById('store-loading');
  const gridEl = document.getElementById('product-grid');

  loadingEl.classList.remove('hidden');
  loadingEl.textContent = 'Loading products…';
  gridEl.innerHTML = '';

  const client = initSupabase();
  if (!client) {
    loadingEl.textContent = 'Supabase unavailable.';
    return;
  }

  try {
    let query = client
      .from('products')
      .select('id, name, description, price, sizes, images, is_active')
      .eq('is_active', true)
      .order('created_at', { ascending: false })
      .limit(24);

    if (STATE.searchQuery && STATE.searchQuery.trim()) {
      const q = STATE.searchQuery.trim();
      query = query.or('name.ilike.%' + q + '%,description.ilike.%' + q + '%');
    }

    const result = await query;
    if (result.error) throw result.error;

    STATE.products = result.data || [];
    loadingEl.classList.add('hidden');

    if (STATE.products.length === 0) {
      loadingEl.textContent = 'No products found.';
      loadingEl.classList.remove('hidden');
      return;
    }

    renderProducts(STATE.products);
  } catch (err) {
    console.error('Supabase fetch error:', err);
    loadingEl.textContent = 'Failed to load products.';
    loadingEl.classList.remove('hidden');
  }
}

function renderProducts(products) {
  const grid = document.getElementById('product-grid');
  grid.innerHTML = '';

  products.forEach(function(p, i) {
    const card = document.createElement('div');
    card.className = 'product-card';
    card.style.animationDelay = (i * 0.06) + 's';

    const imgUrl = (p.images && p.images.length > 0) ? p.images[0] : ASSETS.cloudy;
    const sizes = Array.isArray(p.sizes) && p.sizes.length > 0
      ? p.sizes.map(function(s) { return '<span>' + escapeHtml(String(s)) + '</span>'; }).join('')
      : '';
    const price = (typeof p.price === 'number')
      ? p.price.toFixed(2)
      : Number(p.price || 0).toFixed(2);

    card.innerHTML =
      '<div class="card-img-wrap">' +
        '<img src="' + escapeHtml(imgUrl) + '" alt="' + escapeHtml(p.name || '') + '" loading="lazy" onerror="this.onerror=null;this.src=\'' + ASSETS.cloudy + '\';" />' +
      '</div>' +
      '<div class="card-body">' +
        '<div class="card-name">' + escapeHtml(p.name || 'Untitled') + '</div>' +
        '<div class="card-desc">' + escapeHtml(p.description || '') + '</div>' +
        '<div class="card-foot">' +
          '<div class="card-price">' + price + '</div>' +
          '<div class="card-sizes">' + sizes + '</div>' +
        '</div>' +
      '</div>';

    card.addEventListener('click', function() {
      gsap.fromTo(card, { scale: 0.98 }, { scale: 1, duration: 0.3, ease: 'back.out(2)' });
    });

    grid.appendChild(card);
  });
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/* ---------- SEARCH UI ---------- */
function wireSearchUI() {
  const input = document.getElementById('search-input');
  const goBtn = document.getElementById('search-go');

  function submit() {
    const q = input.value.trim();
    if (!q) return;
    transitionToShipAndWarp(q);
  }

  goBtn.addEventListener('click', submit);
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') submit();
  });
}

/* ---------- FINAL BOOT ---------- */
function finalize() {
  wireSearchUI();
  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = function() {
      window.speechSynthesis.getVoices();
    };
    window.speechSynthesis.getVoices();
  }
  boot();
  console.log('%cVAA STORE — all systems ready.', 'color:#d4af37;font-family:Orbitron;font-size:12px;');
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', finalize);
} else {
  finalize();
}
</script>
